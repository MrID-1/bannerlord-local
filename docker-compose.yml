version: '3.8'

services:
  bannerlord-coop:
    image: scottyhardy/docker-remote-desktop:latest
    container_name: bannerlord_coop_server
    restart: unless-stopped
    environment:
      - WINEARCH=win64
      - DS_ACCEPT_EULA=true
    volumes:
      - /mnt/external/bannerlord-server/DedicatedServer11:/app/server
    ports:
      - "7210:4200/udp"
      - "7210:4200/tcp"
      - "2230:2230/udp"
      - "3389:3389"  # Standard RDP Port mapped to host
    network_mode: bridge