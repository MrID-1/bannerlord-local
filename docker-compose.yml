version: '3.8'

services:
  bannerlord-manager:
    image: scottyhardy/docker-wine:latest
    container_name: bannerlord_manager_gui
    restart: unless-stopped
    environment:
      - WINEARCH=win64
      - DISPLAY=:1
      - DS_ACCEPT_EULA=true
    volumes:
      - /mnt/external/bannerlord-server/DedicatedServer11:/app/server
    working_dir: /app/server
    ports:
      - "3000:8080"        # Maps noVNC web interface to port 3000 on host
      - "7210:7210/udp"
      - "7210:7210/tcp"
      - "2230:2230/udp"
    network_mode: bridge
    command: |
      bash -c "
      apt-get update && apt-get install -y xvfb x11vnc novnc websockify
      Xvfb :1 -screen 0 1280x720x24 &
      sleep 2
      x11vnc -display :1 -nopw -forever -shared -rfbport 5900 &
      websockify --web=/usr/share/novnc/ 8080 localhost:5900 &
      DISPLAY=:1 wine BannerlordCoopServerManager.exe
      "