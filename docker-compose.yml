services:
  bannerlord-coop:
    image: scottyhardy/docker-wine:latest
    container_name: bannerlord_coop_server
    restart: unless-stopped
    environment:
      - WINEARCH=win64
      - RDP_SERVER=yes
      - DS_ACCEPT_EULA=true
      - DISPLAY=:0
      - USER_UID=1000
      - USER_GID=1000
      # default prefix lives in /home/wineuser/.wine, so don't override WINEPREFIX
    volumes:
      - /srv/bannerlord/home:/home/wineuser
      - /storage/bannerlord-server/DedicatedServer11:/app/server
    working_dir: /app/server
    ports:
      - "7210:4200/udp"
      - "7210:4200/tcp"
      - "2230:2230/udp"
      - "3389:3389"