version: '3.8'

services:
  bannerlord-manager:
    image: lscr.io/linuxserver/wine:latest
    container_name: bannerlord_manager_gui
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - DISPLAY=:1
    volumes:
      - /mnt/external/bannerlord-server/DedicatedServer11:/app/server
    ports:
      - "3000:3000"  # Web-based VNC GUI port
      - "7210:7210/udp"
      - "7210:7210/tcp"
      - "2230:2230/udp"
    command: |
      bash -c "
      Xvfb :1 -screen 0 1280x720x24 &
      fluxbox &
      cd /app/server && wine BannerlordCoopServerManager.exe
      "