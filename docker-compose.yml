version: '3.8'

services:
  bannerlord-coop:
    image: dorowu/ubuntu-desktop-lxde-vnc:latest
    container_name: bannerlord_coop_server
    restart: unless-stopped
    environment:
      - WINEARCH=win64
      - DS_ACCEPT_EULA=true
    volumes:
      - /mnt/external/bannerlord-server/DedicatedServer11:/app/server
    working_dir: /app/server
    command: bash -c "wine /app/server/BannerlordCoopServer.exe --accept-eula"
    ports:
      - "7210:4200/udp"
      - "7210:4200/tcp"
      - "2230:2230/udp"
      - "8888:80"  # Exposes the container's built-in web desktop to host port 8888
    network_mode: bridge