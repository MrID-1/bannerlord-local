version: '3.8'

services:
  bannerlord-coop:
    image: ich777/novnc-wine:latest
    container_name: bannerlord_coop_server
    restart: unless-stopped
    environment:
      - CUSTOM_RES_W=1280
      - CUSTOM_RES_H=720
    volumes:
      - /mnt/external/bannerlord-server/DedicatedServer11:/app/server
    working_dir: /app/server
    command: wine /app/server/BannerlordCoopServer.exe --accept-eula
    ports:
      - "7210:4200/udp"
      - "7210:4200/tcp"
      - "2230:2230/udp"
      - "8888:8080"  # Web GUI access port
    network_mode: bridge