version: '3.8'

services:
  bannerlord-coop:
    image: scottyhardy/docker-wine:latest
    container_name: bannerlord_coop_server
    restart: unless-stopped
    environment:
      - WINEARCH=win64
      - RDP_SERVER=yes
      - DS_ACCEPT_EULA=true
      - DISPLAY=:0
    volumes:
      - /mnt/external/bannerlord-server/DedicatedServer11:/app/server
      - /var/bannerlord-wine/wine-home:/home/wineuser
    working_dir: /app/server
    command: ["/usr/bin/entrypoint", "--force-owner"]
    ports:
      - "7210:4200/udp"
      - "7210:4200/tcp"
      - "2230:2230/udp"
      - "3389:3389"
    network_mode: bridge