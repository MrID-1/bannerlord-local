version: '3.8'

services:
  bannerlord-coop:
    image: scottyhardy/docker-wine:latest
    container_name: bannerlord_coop_server
    restart: unless-stopped
    environment:
      - WINEARCH=win64
      - DISPLAY=:0
    volumes:
      - /mnt/external/bannerlord-server/DedicatedServer11:/app/server
    working_dir: /app/server
    command: wine /app/server/BannerlordCoopServer.exe
    ports:
      - "7210:7210/udp"
      - "7210:7210/tcp"
      - "2230:2230/udp"
    network_mode: bridge