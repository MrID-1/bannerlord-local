version: '3.8'

services:
  bannerlord-coop:
    image: scottyhardy/docker-wine:latest
    container_name: bannerlord_coop_server
    restart: unless-stopped
    environment:
      - WINEARCH=win64
      - RDP_SERVER=yes
      - DS_ACCEPT_EULA=true
      - DISPLAY=:0
    volumes:
      # Map server binaries
      - /mnt/external/bannerlord-server/DedicatedServer11:/app/server
      # Map ONLY drive_c so Wine doesn't attempt to chown the entire prefix mount point
      - /mnt/external/bannerlord-server/DedicatedServer11/wine-data/drive_c:/home/wineuser/.wine/drive_c
    working_dir: /app/server
    ports:
      - "7210:4200/udp"
      - "7210:4200/tcp"
      - "2230:2230/udp"
      - "3389:3389"
    network_mode: bridge