version: '3.8'

services:
  bannerlord-coop:
    image: scottyhardy/docker-wine:latest
    container_name: bannerlord_coop_server
    restart: unless-stopped
    environment:
      - WINEARCH=win64
      - RDP_SERVER=yes
      - DS_ACCEPT_EULA=true
      - DISPLAY=:0
      # Force Wine to build drive_c and user profiles inside this exact path
      - WINEPREFIX=/app/server/wine-data
    volumes:
      # Maps server binaries AND the wine-data folder to your physical host drive
      - /mnt/external/bannerlord-server/DedicatedServer11:/app/server
    working_dir: /app/server
    ports:
      - "7210:4200/udp"
      - "7210:4200/tcp"
      - "2230:2230/udp"
      - "3389:3389"
    network_mode: bridge