version: '3.8'

services:
  bannerlord-coop:
    image: scottyhardy/docker-remote-desktop:latest
    container_name: bannerlord_coop_server
    restart: unless-stopped
    environment:
      - WINEARCH=win64
      - DISPLAY=:0
      - DS_ACCEPT_EULA=true
    volumes:
      - /mnt/external/bannerlord-server/DedicatedServer11:/app/server
    working_dir: /app/server
    command: wine /app/server/BannerlordCoopServer.exe --accept-eula
    ports:
      - "7210:4200/udp"
      - "7210:4200/tcp"
      - "2230:2230/udp"
      - "8888:8080"  # Web GUI (noVNC) Port
    network_mode: bridge